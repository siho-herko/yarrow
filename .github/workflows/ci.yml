# PLACEMENT: circulation-safe
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit, regeneration and mutation tests
        run: python -m unittest discover -s tests -t . -v
      - name: Standalone structural checker (the paper's)
        run: python tools/check_structure.py
      - name: Committed tables match a fresh regeneration
        run: python tools/regenerate.py --check
